<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="情宣部">
  <meta name="theme-color" content="#ffffff">

  <!-- docx.js: Wordファイルをブラウザ内だけで生成 -->
  <script src="https://unpkg.com/docx@9.5.1/dist/index.umd.cjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>

  <style>
    :root{
      --bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;
      --line:#e5e7eb;--primary:#111827;--ok:#065f46;--okbg:#ecfdf5;
      --err:#991b1b;--errbg:#fef2f2;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP","Segoe UI",sans-serif;
    }
    .app{min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}
    .shell{max-width:720px;margin:0 auto}
    .header{padding:4px 4px 18px}
    .eyebrow{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:5px}
    h1{margin:0;font-size:25px;line-height:1.25}
    .sub{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.6}
    .card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .field{margin-bottom:18px}
    label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
    .required::after{content:" 必須";color:#b91c1c;font-size:11px;font-weight:700}
    input[type=text],input[type=date],textarea{
      width:100%;appearance:none;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);
      padding:13px 14px;font:inherit;font-size:16px;outline:none
    }
    input:focus,textarea:focus{border-color:#9ca3af;box-shadow:0 0 0 3px rgba(17,24,39,.06)}
    textarea{min-height:210px;resize:vertical;line-height:1.65}
    .notes{min-height:90px}
    .photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .photo-box{border:1px dashed #cbd5e1;border-radius:13px;padding:12px;background:#fafafa}
    .photo-box span{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
    input[type=file]{width:100%;font-size:13px}
    .consent{display:flex;gap:10px;align-items:flex-start;background:#f9fafb;border:1px solid var(--line);border-radius:13px;padding:13px;line-height:1.55;font-size:14px}
    .consent input{margin-top:3px;width:19px;height:19px;flex:0 0 auto}
    .submit{width:100%;border:0;border-radius:14px;padding:15px 18px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:22px}
    .submit:disabled{opacity:.55;cursor:default}
    .status{display:none;border-radius:13px;padding:13px 14px;margin-top:14px;white-space:pre-wrap;font-size:14px;line-height:1.55}
    .status.loading{display:block;background:#f3f4f6;color:#374151}
    .status.success{display:block;background:var(--okbg);color:var(--ok)}
    .status.error{display:block;background:var(--errbg);color:var(--err)}
    .privacy{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6}
    @media(max-width:480px){.photos{grid-template-columns:1fr}.card{padding:16px;border-radius:16px}}
  .date-row { display:flex; gap:8px; align-items:center; }
.date-row input { flex:1; }
.local-note{
  margin-top:10px;
  font-size:12px;
  color:#6b7280;
  text-align:center;
  line-height:1.5;
}

.photo-preview{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:10px;
}
.photo-preview img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:6px;
  border:1px solid #ddd;
}
@media (max-width:600px){
  .photo-preview{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <header class="header">
      <div class="eyebrow">INFORMATION TEAM</div>
      <h1>情宣部 Instagram投稿確認</h1>
      <div class="sub">
        Instagram投稿確認書をWordまたはPDFで作成できます。
      </div>
    </header>

    <main class="card">
      <form id="mainForm">
        <div class="field">
          <label class="required">イベント名</label>
          <input type="text" id="eventName" required placeholder="例：新人研修会">
        </div>

        <div class="field">
          <label>開催日</label>
          <div id="eventDates">
          <div class="date-row">
            <input type="date" class="eventDate" required>
          </div>
        </div>
        <button type="button" id="addDateBtn" style="margin-top:8px;padding:8px 12px;">＋ 開催日を追加</button>
        </div>

        <div class="field">
          <label>作成者</label>
          <input type="text" id="authorName" placeholder="例：小林">
        </div>

        <div class="field">
          <label class="required">Instagram 投稿文</label>
          <textarea id="postText" required placeholder="完成している投稿文をここに貼り付け"></textarea>
        </div>

        <div class="field">
          <label>投稿予定写真（最大10枚）
          <input type="file" id="photos" accept="image/*" multiple>
        </label>
        <div id="photoCount" style="margin-top:8px;font-size:13px;color:#6b7280;">選択した写真：0枚 / 10枚</div>
        <div style="margin-top:3px;font-size:12px;color:#9ca3af;">10枚選択時は 3枚・3枚・4枚で配置されます。</div>
        <div id="photoPreview" class="photo-preview"></div>
          <label class="consent">
            <input type="checkbox" id="photoConsent" required>
            <span>投稿する写真について、Instagramへの掲載許可を事前に確認済みです。</span>
          </label>
        </div>

        <div class="field">
          <label>備考</label>
          <textarea class="notes" id="notes" placeholder="委員長に伝えることがあれば入力"></textarea>
        </div>

        <button class="submit" id="wordBtn" type="button">Wordをダウンロード</button>
        <button class="submit" id="pdfBtn" type="button" style="margin-top:10px;background:#374151;">PDFをダウンロード</button>
        <div id="status" class="status"></div>
        <div class="local-note">入力内容・写真はアップロードされず、端末上で処理されます。</div>
      </form>
    </main>
  </div>
</div>

<script>
const {
  Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
  WidthType, AlignmentType, HeadingLevel, ImageRun, BorderStyle,
  VerticalAlign, ShadingType, TableLayoutType
} = docx;


document.getElementById('addDateBtn').addEventListener('click', () => {
  const wrap = document.getElementById('eventDates');
  const row = document.createElement('div');
  row.className = 'date-row';
  row.style.display = 'flex';
  row.style.gap = '8px';
  row.style.marginTop = '8px';

  const input = document.createElement('input');
  input.type = 'date';
  input.className = 'eventDate';
  input.style.flex = '1';

  const remove = document.createElement('button');
  remove.type = 'button';
  remove.textContent = '削除';
  remove.style.width = 'auto';
  remove.style.padding = '8px 12px';
  remove.addEventListener('click', () => row.remove());

  row.appendChild(input);
  row.appendChild(remove);
  wrap.appendChild(row);
});


const photoInput = document.getElementById('photos');
let selectedPhotos = [];

photoInput.addEventListener('change', () => {
  const incoming = Array.from(photoInput.files || []);
  if (incoming.length > 10) {
    alert('写真は10枚まで選択できます。');
    photoInput.value = '';
    selectedPhotos = [];
  } else {
    selectedPhotos = incoming;
  }
  renderPhotoSelection();
});

function renderPhotoSelection() {
  document.getElementById('photoCount').textContent =
    `選択した写真：${selectedPhotos.length}枚 / 10枚`;

  const preview = document.getElementById('photoPreview');
  preview.innerHTML = '';
  selectedPhotos.forEach(file => {
    const img = document.createElement('img');
    const url = URL.createObjectURL(file);
    img.onload = () => URL.revokeObjectURL(url);
    img.src = url;
    img.alt = file.name;
    preview.appendChild(img);
  });
}

document.getElementById('wordBtn').addEventListener('click', generateWord);
document.getElementById('pdfBtn').addEventListener('click', generatePdf);

async function generateWord() {
  const btn = document.getElementById('wordBtn');
  const status = document.getElementById('status');

  const eventName = document.getElementById('eventName').value.trim();
  const eventDates = [...document.querySelectorAll('.eventDate')]
    .map(el => el.value)
    .filter(Boolean);
  const eventDateText = eventDates.map(formatDate).join('、');
  const authorName = document.getElementById('authorName').value.trim();
  const postText = document.getElementById('postText').value.trim();
  const notes = document.getElementById('notes').value.trim();
  const consent = document.getElementById('photoConsent').checked;

  if (!eventName || eventDates.length === 0 || !postText || !consent) {
    status.className = 'status error';
    status.textContent = '必須項目を確認してください。';
    return;
  }

  btn.disabled = true;
  btn.textContent = '作成中…';
  status.className = 'status loading';
  status.textContent = 'この端末内でWordを作成しています…';

  try {
    // A4縦・左右余白15mmで使える本文幅を固定
    const PAGE_CONTENT_W = 9300;
    const INFO_LABEL_W = 2200;
    const INFO_VALUE_W = PAGE_CONTENT_W - INFO_LABEL_W;
    const PHOTO_CELL_W = Math.floor(PAGE_CONTENT_W / 2); // その他の表用

    const imageFiles = [];
    for (let i = 1; i <= 4; i++) {
      const f = document.getElementById('photo' + i).files[0];
      if (f) imageFiles.push(f);
    }

    const imageCells = [];
    for (let i = 0; i < 4; i++) {
      let children;

      if (i < imageFiles.length) {
        const info = await prepareImage(imageFiles[i]);
        children = [
          new Paragraph({
            alignment: AlignmentType.CENTER,
            children: [
              new ImageRun({
                data: info.buffer,
                transformation: { width: info.width, height: info.height },
                type: info.type
              })
            ]
          })
        ];
      } else {
        children = [new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun('写真なし')] })];
      }

      imageCells.push({ children });
    }

    const borders = {
      top:{style:BorderStyle.SINGLE,size:1,color:'888888'},
      bottom:{style:BorderStyle.SINGLE,size:1,color:'888888'},
      left:{style:BorderStyle.SINGLE,size:1,color:'888888'},
      right:{style:BorderStyle.SINGLE,size:1,color:'888888'},
      insideHorizontal:{style:BorderStyle.SINGLE,size:1,color:'888888'},
      insideVertical:{style:BorderStyle.SINGLE,size:1,color:'888888'}
    };

    const infoRows = [
      ['イベント名', eventName],
      ['開催日', eventDateText],
      ['作成者', authorName]
    ].map(([a,b]) => new TableRow({
      children:[
        new TableCell({
          width:{size:INFO_LABEL_W,type:WidthType.DXA},
          shading:{fill:'EEEEEE',type:ShadingType.CLEAR},
          children:[new Paragraph({children:[new TextRun({text:a,bold:true})]})]
        }),
        new TableCell({
          width:{size:INFO_VALUE_W,type:WidthType.DXA},
          children:[new Paragraph(b || '')]
        })
      ]
    }));

    const children = [
      new Paragraph({
        text:'Instagram 投稿確認書',
        heading:HeadingLevel.HEADING_1,
        alignment:AlignmentType.CENTER
      }),
      new Paragraph({text:'情宣部',alignment:AlignmentType.CENTER}),
      new Paragraph(''),

      new Table({
        width:{size:PAGE_CONTENT_W,type:WidthType.DXA},
        layout:TableLayoutType.FIXED,
        columnWidths:[INFO_LABEL_W, INFO_VALUE_W],
        borders,
        rows:infoRows
      }),

      new Paragraph(''),
      sectionTitle('【Instagram 投稿予定文】'),
      new Table({
        width:{size:PAGE_CONTENT_W,type:WidthType.DXA},
        layout:TableLayoutType.FIXED,
        columnWidths:[PAGE_CONTENT_W],
        borders,
        rows:[
          new TableRow({
            children:[
              new TableCell({
                width:{size:PAGE_CONTENT_W,type:WidthType.DXA},
                children: postText.split(/\r?\n/).map(line => new Paragraph(line || ' '))
              })
            ]
          })
        ]
      }),

      new Paragraph(''),
      sectionTitle('【投稿予定写真】'),
      new Table({
        width:{size:PAGE_CONTENT_W,type:WidthType.DXA},
        layout:TableLayoutType.FIXED,
        borders,
        rows:(() => {
          const n = imageCells.length;
          if (!n) {
            const half = Math.floor(PAGE_CONTENT_W/2);
            return [new TableRow({children:[
              new TableCell({width:{size:half,type:WidthType.DXA},children:[new Paragraph('写真なし')]}),
              new TableCell({width:{size:PAGE_CONTENT_W-half,type:WidthType.DXA},children:[new Paragraph('')]})
            ]})];
          }

          // Instagram 10枚時は 3・3・4。
          // 7枚は3・4、8枚は4・4、9枚は3・3・3。
          let plan;
          if (n <= 3) plan = [n];
          else if (n <= 6) plan = [3, n-3];
          else if (n === 7) plan = [3,4];
          else if (n === 8) plan = [4,4];
          else if (n === 9) plan = [3,3,3];
          else plan = [3,3,4];

          const rows = [];
          let pos = 0;
          for (const count of plan) {
            const baseW = Math.floor(PAGE_CONTENT_W / count);
            const cells = [];
            for (let c=0; c<count; c++) {
              const w = (c === count-1) ? PAGE_CONTENT_W - baseW*(count-1) : baseW;
              const item = imageCells[pos++];
              cells.push(new TableCell({
                width:{size:w,type:WidthType.DXA},
                verticalAlign:VerticalAlign.CENTER,
                children:item.children,
                margins:{top:80,bottom:80,left:80,right:80}
              }));
            }
            rows.push(new TableRow({children:cells}));
          }
          return rows;
        })()
      }),

      new Paragraph(''),
      sectionTitle('【写真掲載確認】'),
      new Paragraph('☑ 投稿する写真について、Instagramへの掲載許可を事前に確認済み')
    ];

    if (notes) {
      children.push(
        new Paragraph(''),
        sectionTitle('【備考】'),
        ...notes.split(/\r?\n/).map(line => new Paragraph(line || ' '))
      );
    }

    children.push(
      new Paragraph(''),
      sectionTitle('【委員長確認】'),
      new Table({
        width:{size:PAGE_CONTENT_W,type:WidthType.DXA},
        layout:TableLayoutType.FIXED,
        columnWidths:[2200, PAGE_CONTENT_W - 2200],
        borders,
        rows:[
          new TableRow({
            children:[
              new TableCell({
                width:{size:2200,type:WidthType.DXA},
                shading:{fill:'EEEEEE',type:ShadingType.CLEAR},
                children:[new Paragraph({children:[new TextRun({text:'確認結果',bold:true})]})]
              }),
              new TableCell({
                width:{size:PAGE_CONTENT_W - 2200,type:WidthType.DXA},
                children:[new Paragraph('□ 投稿可　　　□ 要修正')]
              })
            ]
          }),
          new TableRow({
            children:[
              new TableCell({
                width:{size:2200,type:WidthType.DXA},
                shading:{fill:'EEEEEE',type:ShadingType.CLEAR},
                children:[new Paragraph({children:[new TextRun({text:'確認・修正事項',bold:true})]})]
              }),
              new TableCell({
                width:{size:PAGE_CONTENT_W - 2200,type:WidthType.DXA},
                children:[new Paragraph(''),new Paragraph('')]
              })
            ]
          })
        ]
      }),
      new Paragraph(''),
      new Paragraph({
        text:'確認日：　　　年　　月　　日　　署名：　　　　　　　　　',
        alignment:AlignmentType.RIGHT
      })
    );

    const word = new Document({
      creator:'情宣部 Instagram投稿確認',
      sections:[{
        properties:{
          page:{
            size:{width:11906,height:16838},
            margin:{top:850,right:850,bottom:850,left:850}
          }
        },
        children
      }]
    });

    const blob = await Packer.toBlob(word);
    const fileName = sanitizeFileName(eventName) + '_Instagram投稿確認書.docx';
    downloadBlob(blob, fileName);

    status.className = 'status success';
    status.textContent = 'Word確認書をダウンロードしました。';

  } catch (err) {
    console.error(err);
    status.className = 'status error';
    status.textContent = 'Word作成に失敗しました。\n' + (err?.message || err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Wordをダウンロード';
  }
}


async function generatePdf() {
  const btn = document.getElementById('pdfBtn');
  const status = document.getElementById('status');

  const eventName = document.getElementById('eventName').value.trim();
  const eventDates = [...document.querySelectorAll('.eventDate')].map(el => el.value).filter(Boolean);
  const eventDateText = eventDates.map(formatDate).join('、');
  const authorName = document.getElementById('authorName').value.trim();
  const postText = document.getElementById('postText').value.trim();
  const notes = document.getElementById('notes').value.trim();
  const consent = document.getElementById('photoConsent').checked;

  if (!eventName || eventDates.length === 0 || !postText || !consent) {
    status.className = 'status error';
    status.textContent = '必須項目を確認してください。';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'PDF作成中…';
  status.className = 'status loading';
  status.textContent = 'PDFを作成しています…';

  try {
    const { PDFDocument } = PDFLib;

    // Safari/iPhoneで日本語PDFフォントが崩れる問題を避けるため、
    // 文字・表・写真をブラウザのCanvasで描画し、そのページ画像をPDF化する。
    // これにより日本語は端末のブラウザフォントで確実に描画される。
    const PAGE_W = 1240;
    const PAGE_H = 1754;
    const M = 72;
    const CONTENT_W = PAGE_W - M * 2;

    const makePage = () => {
      const canvas = document.createElement('canvas');
      canvas.width = PAGE_W;
      canvas.height = PAGE_H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, PAGE_W, PAGE_H);
      ctx.fillStyle = '#000000';
      ctx.strokeStyle = '#999999';
      ctx.lineWidth = 1.5;
      ctx.textBaseline = 'top';
      return { canvas, ctx, y: M };
    };

    let p = makePage();
    const pages = [p];

    const setFont = (size, bold=false) => {
      p.ctx.font = `${bold ? '700' : '400'} ${size}px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif`;
      p.ctx.fillStyle = '#000';
    };

    const newPage = () => {
      p = makePage();
      pages.push(p);
    };

    const ensure = (h) => {
      if (p.y + h > PAGE_H - M) newPage();
    };

    const wrapText = (text, maxW, size=24, bold=false) => {
      setFont(size, bold);
      const lines = [];
      for (const para of String(text ?? '').split(/\r?\n/)) {
        if (!para) { lines.push(''); continue; }
        let line = '';
        for (const ch of para) {
          const test = line + ch;
          if (line && p.ctx.measureText(test).width > maxW) {
            lines.push(line);
            line = ch;
          } else {
            line = test;
          }
        }
        lines.push(line);
      }
      return lines;
    };

    const drawCentered = (text, size, bold=false) => {
      setFont(size, bold);
      const w = p.ctx.measureText(text).width;
      p.ctx.fillText(text, (PAGE_W - w) / 2, p.y);
      p.y += size + 14;
    };

    const drawInfoRow = (label, value) => {
      const labelW = 250;
      const h = 58;
      ensure(h);
      p.ctx.strokeRect(M, p.y, CONTENT_W, h);
      p.ctx.beginPath();
      p.ctx.moveTo(M + labelW, p.y);
      p.ctx.lineTo(M + labelW, p.y + h);
      p.ctx.stroke();

      setFont(22, true);
      p.ctx.fillText(label, M + 14, p.y + 16);

      setFont(22, false);
      const lines = wrapText(value || '', CONTENT_W - labelW - 28, 22, false);
      p.ctx.fillText(lines[0] || '', M + labelW + 14, p.y + 16);
      p.y += h;
    };

    const drawSection = (title) => {
      ensure(52);
      p.y += 22;
      setFont(24, true);
      p.ctx.fillText(title, M, p.y);
      p.y += 38;
    };

    drawCentered('Instagram 投稿確認書', 38, true);
    drawCentered('情宣部', 24, false);
    p.y += 10;

    drawInfoRow('イベント名', eventName);
    drawInfoRow('開催日', eventDateText);
    drawInfoRow('作成者', authorName);

    drawSection('【Instagram 投稿予定文】');

    const postLines = wrapText(postText, CONTENT_W - 28, 22);
    const postLineH = 34;
    const postH = Math.max(96, postLines.length * postLineH + 28);

    // 投稿文がページに入り切らない場合は枠を分割せず、行ごとに安全に描画
    if (p.y + postH <= PAGE_H - M) {
      p.ctx.strokeRect(M, p.y, CONTENT_W, postH);
      let ty = p.y + 14;
      setFont(22, false);
      for (const line of postLines) {
        p.ctx.fillText(line, M + 14, ty);
        ty += postLineH;
      }
      p.y += postH;
    } else {
      for (const line of postLines) {
        ensure(postLineH + 6);
        setFont(22, false);
        p.ctx.fillText(line, M + 8, p.y);
        p.y += postLineH;
      }
    }

    // 写真読み込み
    const photoFiles = selectedPhotos.slice(0, 10);

    const loadedImages = [];
    for (const file of photoFiles) {
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const im = new Image();
          im.onload = () => resolve(im);
          im.onerror = reject;
          im.src = url;
        });
        loadedImages.push(img);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    if (loadedImages.length) {
      const n = loadedImages.length;

      // 10枚 = 3・3・4。少ない枚数も自然に均等配置。
      let plan;
      if (n <= 3) plan = [n];
      else if (n <= 6) plan = [3, n-3];
      else if (n === 7) plan = [3,4];
      else if (n === 8) plan = [4,4];
      else if (n === 9) plan = [3,3,3];
      else plan = [3,3,4];

      const rowGap = 18;
      const cellH = 235;
      const needed = 60 + plan.length * cellH + Math.max(0, plan.length-1) * rowGap;

      // 写真全体が入らなければ写真セクションから新しいページへ。
      if (p.y + needed > PAGE_H - M - 240) newPage();

      drawSection('【投稿予定写真】');

      let imageIndex = 0;
      for (const count of plan) {
        ensure(cellH + rowGap);

        const colGap = 14;
        const cellW = (CONTENT_W - colGap * (count - 1)) / count;
        const rowY = p.y;

        for (let c=0; c<count; c++) {
          const img = loadedImages[imageIndex++];
          const x = M + c * (cellW + colGap);

          // 枠内にアスペクト比を保って収める。
          const scale = Math.min(
            (cellW - 8) / img.naturalWidth,
            (cellH - 8) / img.naturalHeight
          );
          const w = img.naturalWidth * scale;
          const h = img.naturalHeight * scale;

          p.ctx.drawImage(
            img,
            x + (cellW - w) / 2,
            rowY + (cellH - h) / 2,
            w,
            h
          );
        }

        p.y += cellH + rowGap;
      }
    }

    drawSection('【写真掲載確認】');
    const consentText = '✓ 投稿する写真について、Instagramへの掲載許可を事前に確認済み';
    const consentLines = wrapText(consentText, CONTENT_W, 22);
    for (const line of consentLines) {
      ensure(34);
      setFont(22, false);
      p.ctx.fillText(line, M, p.y);
      p.y += 34;
    }

    if (notes) {
      drawSection('【備考】');
      const noteLines = wrapText(notes, CONTENT_W - 20, 22);
      for (const line of noteLines) {
        ensure(34);
        setFont(22, false);
        p.ctx.fillText(line, M + 6, p.y);
        p.y += 34;
      }
    }

    // 確認欄が途中で切れないよう、必要ならまとめて次ページへ
    const confirmNeeded = 210;
    if (p.y + confirmNeeded > PAGE_H - M) newPage();

    drawSection('【委員長確認】');
    drawInfoRow('確認結果', '□ 投稿可　　　□ 要修正');

    const labelW = 250;
    const h = 100;
    ensure(h);
    p.ctx.strokeRect(M, p.y, CONTENT_W, h);
    p.ctx.beginPath();
    p.ctx.moveTo(M + labelW, p.y);
    p.ctx.lineTo(M + labelW, p.y + h);
    p.ctx.stroke();

    setFont(22, true);
    p.ctx.fillText('確認・修正事項', M + 14, p.y + 18);
    p.y += h + 28;

    ensure(40);
    setFont(21, false);
    p.ctx.fillText('確認日：　　　年　　月　　日　　署名：　　　　　　　　　', M, p.y);

    // CanvasページをそのままPDFページに貼る
    const pdf = await PDFDocument.create();
    for (const pg of pages) {
      const dataUrl = pg.canvas.toDataURL('image/png');
      const png = await pdf.embedPng(dataUrl);
      const pdfPage = pdf.addPage([595.28, 841.89]);
      pdfPage.drawImage(png, {x:0, y:0, width:595.28, height:841.89});
    }

    const pdfBytes = await pdf.save();
    downloadBlob(
      new Blob([pdfBytes], {type:'application/pdf'}),
      sanitizeFileName(eventName) + '_Instagram投稿確認書.pdf'
    );

    status.className = 'status success';
    status.textContent = 'PDF確認書をダウンロードしました。';
  } catch (err) {
    console.error(err);
    status.className = 'status error';
    status.textContent = 'PDF作成に失敗しました。\n' + (err?.message || err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'PDFをダウンロード';
  }
}

function imageFileToJpegDataUrl(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg',0.9));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('PDF用に画像を変換できませんでした: ' + file.name));
    };
    img.src = url;
  });
}

function sectionTitle(text) {
  return new Paragraph({children:[new TextRun({text,bold:true})]});
}

function formatDate(value) {
  if (!value) return '';
  const [y,m,d] = value.split('-');
  return `${y}年${Number(m)}月${Number(d)}日`;
}

function sanitizeFileName(name) {
  return (name || 'Instagram投稿')
    .replace(/[\\/:*?"<>|]/g,'_')
    .replace(/\s+/g,' ')
    .trim()
    .slice(0,80);
}

function downloadBlob(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

async function prepareImage(file) {
  const arrayBuffer = await file.arrayBuffer();
  const dims = await getImageDimensions(file);

  // 2列写真表に収まるよう少し小さめに固定
  const maxW = 180;
  const maxH = 145;
  const scale = Math.min(maxW / dims.width, maxH / dims.height, 1);

  let type = 'jpg';
  if (file.type.includes('png')) type = 'png';
  else if (file.type.includes('gif')) type = 'gif';
  else if (file.type.includes('bmp')) type = 'bmp';

  return {
    buffer: arrayBuffer,
    width: Math.max(1, Math.round(dims.width * scale)),
    height: Math.max(1, Math.round(dims.height * scale)),
    type
  };
}

function getImageDimensions(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = () => {
      const width = img.naturalWidth || img.width;
      const height = img.naturalHeight || img.height;
      URL.revokeObjectURL(url);
      resolve({width,height});
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('画像を読み込めませんでした: ' + file.name));
    };

    img.src = url;
  });
}
